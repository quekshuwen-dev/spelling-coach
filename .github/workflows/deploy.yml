# Builds, checks and deploys Spelling Coach to Firebase Hosting.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT — see DEPLOY.md.
# Nothing else: the project id lives in .firebaserc and the (public) Firebase
# web config in .env.production, so there is nothing else to configure here.
name: Deploy

on:
  push:
    branches: [main, claude/beautiful-ride-hi7n1q]
  # Lets you redeploy the current commit from the Actions tab without pushing.
  workflow_dispatch:

# A second push while one deploy is running would otherwise race it, and the
# older build could land last. Newer always wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gates, not decoration: a red build must not reach a child mid-practice.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Write the deploy key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. See DEPLOY.md for how to create it."
            exit 1
          fi
          # RUNNER_TEMP is outside the checkout, so the key can never be picked
          # up by the build or committed by accident.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

      # This is the step that must reach the child: the app itself. It gates
      # the job, so a failure here is loud and the run is red.
      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        # firebase.json's predeploy hook runs the build, so this covers it.
        run: npx firebase-tools deploy --only hosting --non-interactive

      # Best-effort, deliberately: failing the job here would also block the
      # app itself going live over what is usually a separate IAM permission
      # from the one hosting needs. But this is a SECURITY-RELEVANT step, not
      # a nice-to-have — see the loud warning below and DEPLOY.md.
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          if ! npx firebase-tools deploy --only firestore:rules --non-interactive; then
            echo "::warning::Firestore rules did NOT deploy. This repo's firestore.rules (confines each user to their own data) is NOT what is protecting your database right now — whatever was last set in the Firebase console is. If the database was created in test mode, IT IS OPEN TO ANYONE until this is fixed. See DEPLOY.md's IAM note."
          fi

      - name: Clean up the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"

      - name: Where it went
        run: echo "### Live at https://spelling-coach-61d31.web.app" >> "$GITHUB_STEP_SUMMARY"
