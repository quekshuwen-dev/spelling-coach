<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF4E11"/>
    </linearGradient>
  </defs>
  <!-- Orange rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Notebook body -->
  <rect x="8" y="5" width="18" height="22" rx="2" fill="white" opacity="0.95"/>
  <!-- Spine -->
  <rect x="8" y="5" width="4" height="22" rx="2" fill="#FFF8E1"/>
  <!-- Spiral dots -->
  <circle cx="10" cy="10" r="1.2" fill="#90A4AE"/>
  <circle cx="10" cy="14" r="1.2" fill="#90A4AE"/>
  <circle cx="10" cy="18" r="1.2" fill="#90A4AE"/>
  <circle cx="10" cy="22" r="1.2" fill="#90A4AE"/>
  <!-- SPELL text -->
  <text x="14" y="12" font-family="Arial Black, Arial" font-weight="900" font-size="5" fill="#FF5722">SPELL</text>
  <!-- Checkboxes -->
  <rect x="13" y="14" width="4" height="4" rx="0.8" fill="#FF5722"/>
  <polyline points="13.8,16 14.8,17 16.5,14.8" fill="none" stroke="white" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="13" y="19.5" width="4" height="4" rx="0.8" fill="none" stroke="#FF5722" stroke-width="0.7"/>
  <!-- Pencil -->
  <g transform="translate(23,8) rotate(20)">
    <rect x="-1.2" y="-7" width="2.4" height="9" fill="#FFD54F"/>
    <rect x="-1.2" y="-8.2" width="2.4" height="1.5" rx="0.5" fill="#F48FB1"/>
    <polygon points="-1.2,2 1.2,2 0,4.5" fill="#D4A86A"/>
    <polygon points="-0.5,3.5 0.5,3.5 0,4.5" fill="#37474F"/>
  </g>
</svg>
