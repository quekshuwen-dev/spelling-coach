<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="100%" stop-color="#F06000"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Notebook -->
  <rect x="7" y="5" width="18" height="22" rx="2" fill="white" opacity="0.95"/>
  <!-- Spine -->
  <rect x="7" y="5" width="3.5" height="22" rx="2" fill="#FFF0D0"/>
  <!-- Spiral rings -->
  <circle cx="8.75" cy="10" r="1.1" fill="none" stroke="#90A4AE" stroke-width="0.8"/>
  <circle cx="8.75" cy="14" r="1.1" fill="none" stroke="#90A4AE" stroke-width="0.8"/>
  <circle cx="8.75" cy="18" r="1.1" fill="none" stroke="#90A4AE" stroke-width="0.8"/>
  <circle cx="8.75" cy="22" r="1.1" fill="none" stroke="#90A4AE" stroke-width="0.8"/>
  <!-- SPELL text -->
  <text x="12.5" y="11.5" font-family="Arial Black, Arial" font-weight="900" font-size="5.5" fill="#333">SPELL</text>
  <!-- Checkbox 1 (checked, orange) -->
  <rect x="12" y="14" width="4" height="4" rx="0.7" fill="#F07020"/>
  <polyline points="12.8,16 14,17.2 16,14.5" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Checkbox 2 -->
  <rect x="12" y="19.5" width="4" height="4" rx="0.7" fill="none" stroke="#CCCCCC" stroke-width="0.8"/>
  <!-- Pencil -->
  <g transform="translate(22,9) rotate(30)">
    <rect x="-1.4" y="-7.5" width="2.8" height="1.8" rx="0.6" fill="#F48FB1"/>
    <rect x="-1.4" y="-5.7" width="2.8" height="0.6" fill="#B0BEC5"/>
    <rect x="-1.4" y="-5.1" width="2.8" height="7" fill="#FFD54F"/>
    <polygon points="-1.4,1.9 1.4,1.9 0,4.5" fill="#D4956A"/>
    <polygon points="-0.5,3.6 0.5,3.6 0,4.5" fill="#37474F"/>
  </g>
</svg>
